<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)"/>
  
  <!-- Outer QR Frame Box -->
  <rect x="96" y="96" width="320" height="320" rx="36" fill="none" stroke="#ffffff" stroke-width="24" stroke-opacity="0.95"/>
  
  <!-- Top Left QR Corner -->
  <rect x="136" y="136" width="80" height="80" rx="16" fill="#ffffff"/>
  <rect x="156" y="156" width="40" height="40" rx="8" fill="#047857"/>

  <!-- Top Right QR Corner -->
  <rect x="296" y="136" width="80" height="80" rx="16" fill="#ffffff"/>
  <rect x="316" y="156" width="40" height="40" rx="8" fill="#047857"/>

  <!-- Bottom Left QR Corner -->
  <rect x="136" y="296" width="80" height="80" rx="16" fill="#ffffff"/>
  <rect x="156" y="316" width="40" height="40" rx="8" fill="#047857"/>

  <!-- Center Dining Plate & Cloche Motif -->
  <circle cx="316" cy="316" r="44" fill="#ffffff"/>
  <path d="M 296 324 A 20 20 0 0 1 336 324 Z" fill="#047857"/>
  <circle cx="316" cy="300" r="5" fill="#047857"/>
  <line x1="290" y1="328" x2="342" y2="328" stroke="#047857" stroke-width="4" stroke-linecap="round"/>
</svg>
